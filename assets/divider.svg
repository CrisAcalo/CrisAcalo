<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="100%" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2d47" stop-opacity="0" />
      <stop offset="20%" stop-color="#1e2d47" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#1e2d47" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e2d47" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <clipPath id="lineClip">
      <rect x="40" y="12" width="1120" height="4" rx="2" />
    </clipPath>
  </defs>

  <rect x="40" y="13.25" width="1120" height="1.5" fill="url(#trackGrad)" />

  <g clip-path="url(#lineClip)">
    <rect x="-180" y="12.5" width="180" height="3" fill="url(#pulseRight)">
      <animate attributeName="x" from="-180" to="1220" dur="4.2s" repeatCount="indefinite" />
    </rect>
    <rect x="1220" y="12.5" width="180" height="3" fill="url(#pulseLeft)">
      <animate attributeName="x" from="1220" to="-180" dur="4.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <polygon points="600,6 608,14 600,22 592,14" fill="#0b0e1a" stroke="#a855f7" stroke-width="1.5" />
  <circle cx="600" cy="14" r="2.6" fill="#d946ef">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
