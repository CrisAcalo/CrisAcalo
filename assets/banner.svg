<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Cristian Acalo - Full Stack Developer">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="65%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#111830" />
    </linearGradient>

    <linearGradient id="nameAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="320" rx="12" />
    </clipPath>

    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace; }
      @keyframes blinkStep {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .blink { animation: blinkStep 1s steps(1, end) infinite; }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Sky background -->
    <rect width="1200" height="320" fill="url(#skyGrad)" />

    <!-- Twinkling Pixel Stars -->
    <g shape-rendering="crispEdges">
      <rect x="92" y="28" width="4" height="4" fill="#818cf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
      </rect>
      <rect x="240" y="22" width="4" height="4" fill="#e2e8f0">
        <animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.4s" repeatCount="indefinite" />
      </rect>
      <rect x="380" y="54" width="4" height="4" fill="#d946ef">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite" />
      </rect>
      <rect x="468" y="30" width="6" height="6" fill="#38bdf8">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite" />
      </rect>
      <rect x="548" y="88" width="4" height="4" fill="#c084fc">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.6s" repeatCount="indefinite" />
      </rect>
      <rect x="616" y="42" width="4" height="4" fill="#e2e8f0">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4s" repeatCount="indefinite" />
      </rect>
      <rect x="642" y="132" width="4" height="4" fill="#818cf8">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite" />
      </rect>

      <!-- Shooting pixel star -->
      <g opacity="0">
        <rect x="0" y="0" width="6" height="6" fill="#f8fafc" />
        <rect x="-6" y="-4" width="4" height="4" fill="#38bdf8" opacity="0.8" />
        <rect x="-12" y="-8" width="4" height="4" fill="#818cf8" opacity="0.5" />
        <animateMotion path="M 320 -10 L 620 150" dur="1.4s" begin="1s;8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="7s" repeatCount="indefinite" />
      </g>

      <!-- Pixel-art mountain & Cotopaxi silhouette along the bottom -->
      <path d="M 0 320 L 0 288 L 48 288 L 48 276 L 96 276 L 96 264 L 144 264 L 144 276 L 192 276 L 192 288 L 288 288 L 288 272 L 320 272 L 320 256 L 352 256 L 352 240 L 384 240 L 384 224 L 416 224 L 416 208 L 464 208 L 464 224 L 496 224 L 496 240 L 528 240 L 528 256 L 560 256 L 560 272 L 608 272 L 608 288 L 720 288 L 720 276 L 780 276 L 780 288 L 1200 288 L 1200 320 Z" fill="#121a33" />
      <!-- Snow cap on pixel volcano -->
      <path d="M 416 208 L 464 208 L 464 224 L 480 224 L 480 232 L 456 232 L 456 226 L 440 226 L 440 232 L 424 232 L 424 224 L 416 224 Z" fill="#1e2b4f" />
    </g>

    <!-- Left status pill (pixel style) -->
    <g shape-rendering="crispEdges">
      <rect x="64" y="46" width="236" height="30" fill="#11182d" stroke="#28385c" stroke-width="2" />
      <rect x="78" y="57" width="8" height="8" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
      </rect>
    </g>
    <text x="98" y="66" fill="#cbd5e1" font-size="12.5" font-weight="600" class="mono">Evaluar · Latacunga, EC</text>

    <!-- Name -->
    <text x="64" y="140" fill="#f8fafc" font-size="52" font-weight="800" letter-spacing="-1" class="sans">Cristian Acalo</text>

    <!-- Pixel progress/accent bar -->
    <g shape-rendering="crispEdges">
      <rect x="64" y="156" width="320" height="4" fill="#1a2542" />
      <rect x="64" y="156" width="80" height="4" fill="url(#nameAccent)">
        <animate attributeName="x" values="64;304;64" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Concise human subtitle -->
    <text x="64" y="196" fill="#a5b4fc" font-size="21" font-weight="700" class="sans">Full Stack · Go · TypeScript · AWS</text>

    <!-- Prompt line -->
    <text x="64" y="238" fill="#94a3b8" font-size="14" class="mono">&gt; sistemas distribuidos, agentes y cosas que corren solas</text>
    <rect class="blink" x="546" y="226" width="8" height="14" fill="#d946ef" shape-rendering="crispEdges" />

    <!-- Right: Pixel Retro Terminal Window -->
    <g shape-rendering="crispEdges">
      <rect x="684" y="46" width="456" height="232" fill="#0d1324" stroke="#2d3e66" stroke-width="2" />
      <!-- Title bar -->
      <rect x="684" y="46" width="456" height="30" fill="#151f38" stroke="#2d3e66" stroke-width="2" />
      <rect x="1084" y="56" width="10" height="10" fill="#64748b" />
      <rect x="1100" y="56" width="10" height="10" fill="#818cf8" />
      <rect x="1116" y="56" width="10" height="10" fill="#d946ef" />
    </g>
    <text x="702" y="66" fill="#94a3b8" font-size="12" font-weight="600" class="mono">cris@lab:~/profile</text>

    <!-- Minimal profile lines -->
    <text x="702" y="108" font-size="13.5" class="mono">
      <tspan fill="#818cf8">role</tspan><tspan fill="#64748b">  = </tspan><tspan fill="#e2e8f0">"Full Stack @ Evaluar"</tspan>
    </text>
    <text x="702" y="138" font-size="13.5" class="mono">
      <tspan fill="#818cf8">stack</tspan><tspan fill="#64748b"> = </tspan><tspan fill="#cbd5e1">["Go", "TS", "Nuxt", "AWS"]</tspan>
    </text>
    <text x="702" y="168" font-size="13.5" class="mono">
      <tspan fill="#818cf8">lab</tspan><tspan fill="#64748b">   = </tspan><tspan fill="#cbd5e1">["relevo", "Quant", "Mori"]</tspan>
    </text>
    <text x="702" y="198" font-size="13.5" class="mono">
      <tspan fill="#818cf8">city</tspan><tspan fill="#64748b">  = </tspan><tspan fill="#38bdf8">"Latacunga, EC"</tspan>
    </text>
    <text x="702" y="250" font-size="13" class="mono">
      <tspan fill="#34d399">$</tspan>
      <tspan fill="#cbd5e1"> ./build --night</tspan>
    </text>
    <rect class="blink" x="848" y="239" width="8" height="13" fill="#34d399" shape-rendering="crispEdges" />

    <!-- Pixel Coffee Mug with rising steam (bottom right inside window) -->
    <g transform="translate(1002, 226) scale(3)" shape-rendering="crispEdges">
      <!-- Steam -->
      <g fill="#94a3b8">
        <rect x="2" y="0" width="1" height="1">
          <animate attributeName="y" values="1;-1;1" dur="1.8s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="4" y="-1" width="1" height="1">
          <animate attributeName="y" values="0;-2;0" dur="2.1s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.1s" repeatCount="indefinite" />
        </rect>
      </g>
      <!-- Mug -->
      <rect x="1" y="3" width="5" height="1" fill="#e2e8f0" />
      <rect x="1" y="4" width="5" height="4" fill="#cbd5e1" />
      <rect x="2" y="4" width="3" height="1" fill="#92400e" />
      <rect x="6" y="4" width="2" height="1" fill="#94a3b8" />
      <rect x="7" y="5" width="1" height="2" fill="#94a3b8" />
      <rect x="6" y="7" width="2" height="1" fill="#94a3b8" />
      <rect x="2" y="8" width="3" height="1" fill="#64748b" />
    </g>

    <!-- Animated Pixel Cat Mascot (bottom right inside window) -->
    <g transform="translate(1056, 208) scale(4)" shape-rendering="crispEdges">
      <!-- Ears -->
      <rect x="2" y="0" width="1" height="1" fill="#a855f7" />
      <rect x="8" y="0" width="1" height="1" fill="#a855f7" />
      <rect x="1" y="1" width="3" height="1" fill="#a855f7" />
      <rect x="7" y="1" width="3" height="1" fill="#a855f7" />
      <rect x="2" y="1" width="1" height="1" fill="#f0abfc" />
      <rect x="8" y="1" width="1" height="1" fill="#f0abfc" />
      <!-- Head -->
      <rect x="1" y="2" width="9" height="4" fill="#a855f7" />
      <rect x="2" y="5" width="7" height="1" fill="#9333ea" />
      <!-- Blinking cyan pixel eyes -->
      <rect x="3" y="3" width="1" height="1" fill="#38bdf8">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.85;0.9;0.95;1" dur="3.6s" repeatCount="indefinite" />
      </rect>
      <rect x="7" y="3" width="1" height="1" fill="#38bdf8">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.85;0.9;0.95;1" dur="3.6s" repeatCount="indefinite" />
      </rect>
      <!-- Nose -->
      <rect x="5" y="4" width="1" height="1" fill="#f472b6" />
      <!-- Body -->
      <rect x="2" y="6" width="7" height="3" fill="#9333ea" />
      <rect x="1" y="7" width="8" height="2" fill="#7e22ce" />
      <!-- Paws -->
      <rect x="2" y="9" width="2" height="1" fill="#e9d5ff" />
      <rect x="7" y="9" width="2" height="1" fill="#e9d5ff" />
      <!-- Animated pixel tail -->
      <rect x="10" y="6" width="1" height="2" fill="#c084fc">
        <animate attributeName="x" values="10;11;10" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="9" y="8" width="2" height="1" fill="#a855f7" />
    </g>
  </g>

  <!-- Crisp Pixel Border + Corner Rivets -->
  <g shape-rendering="crispEdges">
    <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#253456" stroke-width="2" />
    <rect x="4" y="4" width="6" height="6" fill="#818cf8" />
    <rect x="1190" y="4" width="6" height="6" fill="#d946ef" />
    <rect x="4" y="310" width="6" height="6" fill="#38bdf8" />
    <rect x="1190" y="310" width="6" height="6" fill="#a855f7" />
  </g>
</svg>
