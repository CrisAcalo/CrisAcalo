<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Cristian Acalo - Full Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="55%" stop-color="#0b0e1a" />
      <stop offset="100%" stop-color="#11162b" />
    </linearGradient>

    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="28%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-1 0" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="borderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <filter id="auroraBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55" />
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e2d47" stroke-width="0.7" opacity="0.38" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="340" rx="16" />
    </clipPath>

    <clipPath id="underlineClip">
      <rect x="64" y="158" width="368" height="3" rx="1.5" />
    </clipPath>

    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace; }
      @keyframes driftA {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(42px, -22px) scale(1.1); }
      }
      @keyframes driftB {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-36px, 24px) scale(1.12); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.1; }
      }
      @keyframes floatP {
        0%, 100% { transform: translateY(0px); opacity: 0.25; }
        50% { transform: translateY(-12px); opacity: 0.85; }
      }
      .orb-a { animation: driftA 10s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .orb-b { animation: driftB 13s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .cursor-blink { animation: blink 1.05s steps(1, end) infinite; }
      .particle-1 { animation: floatP 4.5s ease-in-out infinite; }
      .particle-2 { animation: floatP 6.2s ease-in-out infinite 1.2s; }
      .particle-3 { animation: floatP 5.4s ease-in-out infinite 2.4s; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="340" fill="url(#bgGrad)" />
    <rect width="1200" height="340" fill="url(#grid)" />

    <!-- Scanning light beam -->
    <rect x="-260" y="0" width="260" height="340" fill="url(#scanBeam)">
      <animate attributeName="x" from="-260" to="1260" dur="8s" repeatCount="indefinite" />
    </rect>

    <!-- Aurora orbs -->
    <circle class="orb-a" cx="180" cy="70" r="150" fill="#6366f1" opacity="0.25" filter="url(#auroraBlur)" />
    <circle class="orb-b" cx="530" cy="290" r="145" fill="#a855f7" opacity="0.20" filter="url(#auroraBlur)" />
    <circle class="orb-a" cx="1030" cy="85" r="160" fill="#d946ef" opacity="0.22" filter="url(#auroraBlur)" />

    <!-- Ambient constellation particles -->
    <circle class="particle-1" cx="465" cy="74" r="2" fill="#818cf8" />
    <circle class="particle-2" cx="555" cy="118" r="1.8" fill="#d946ef" />
    <circle class="particle-3" cx="622" cy="64" r="2.2" fill="#38bdf8" />
    <circle class="particle-1" cx="645" cy="212" r="1.8" fill="#a855f7" />
    <circle class="particle-2" cx="412" cy="285" r="2" fill="#38bdf8" />
    <circle class="particle-3" cx="615" cy="306" r="1.6" fill="#818cf8" />

    <!-- Top status badge -->
    <rect x="64" y="44" width="272" height="32" rx="16" fill="#111729" fill-opacity="0.9" stroke="#283757" stroke-width="1" />
    <circle cx="84" cy="60" r="4.5" fill="#34d399" opacity="0.7">
      <animate attributeName="r" values="4;11;4" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.75;0;0.75" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="84" cy="60" r="4" fill="#34d399" />
    <text x="99" y="65" fill="#cbd5e1" font-size="13" font-weight="500" class="mono">Evaluar · Latacunga, EC</text>

    <!-- Animated equalizer bars inside badge -->
    <rect x="302" y="57" width="2.5" height="6" rx="1" fill="#818cf8">
      <animate attributeName="height" values="4;12;6;10;4" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="59;54;58;55;59" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="308" y="54" width="2.5" height="12" rx="1" fill="#a855f7">
      <animate attributeName="height" values="11;5;13;4;11" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="54;58;53;59;54" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="314" y="56" width="2.5" height="8" rx="1" fill="#d946ef">
      <animate attributeName="height" values="6;13;4;11;6" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="58;53;59;54;58" dur="1.6s" repeatCount="indefinite" />
    </rect>

    <!-- Name & animated accent bar -->
    <text x="64" y="140" fill="#f8fafc" font-size="54" font-weight="800" letter-spacing="-1.2" class="sans">Cristian Acalo</text>
    <rect x="64" y="158" width="368" height="3" rx="1.5" fill="#1e2d47" />
    <g clip-path="url(#underlineClip)">
      <rect x="-40" y="158" width="130" height="3" rx="1.5" fill="url(#lineGlow)">
        <animate attributeName="x" from="-40" to="440" dur="3.4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Role & tech subtitle -->
    <text x="64" y="196" fill="url(#roleGrad)" font-size="21.5" font-weight="700" class="sans">Full Stack · Sistemas Event-Driven · IA Aplicada</text>
    <text x="64" y="232" fill="#94a3b8" font-size="14.5" class="mono">Go · TypeScript · Nuxt · AWS Serverless · Cloudflare Workers</text>

    <!-- Terminal prompt strip -->
    <rect x="64" y="258" width="554" height="36" rx="9" fill="#0b1020" fill-opacity="0.92" stroke="#1e2d47" stroke-width="1" />
    <text x="80" y="281" font-size="13" class="mono">
      <tspan fill="#d946ef" font-weight="700">&gt;</tspan>
      <tspan fill="#818cf8"> now</tspan>
      <tspan fill="#64748b"> --shipping </tspan>
      <tspan fill="#cbd5e1">"agentes · CUDA pipelines · trading 24/7"</tspan>
    </text>
    <rect class="cursor-blink" x="528" y="269" width="8" height="15" rx="1.5" fill="#d946ef" />

    <!-- Right profile.toml terminal card -->
    <rect x="688" y="42" width="448" height="256" rx="14" fill="#111729" fill-opacity="0.86" stroke="#283757" stroke-width="1.2" />
    <!-- Orbiting border light -->
    <rect x="688" y="42" width="448" height="256" rx="14" fill="none" stroke="url(#borderBeam)" stroke-width="1.8" stroke-dasharray="150 1230" opacity="0.85" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-1380" dur="6.5s" repeatCount="indefinite" />
    </rect>

    <!-- Card header -->
    <circle cx="714" cy="67" r="5" fill="#475569" />
    <circle cx="732" cy="67" r="5" fill="#6366f1" />
    <circle cx="750" cy="67" r="5" fill="#d946ef" />
    <text x="772" y="71" fill="#64748b" font-size="12.5" class="mono">profile.toml</text>

    <!-- Live telemetry pill in card header -->
    <circle cx="1072" cy="67" r="3" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="1082" y="71" fill="#34d399" font-size="11" font-weight="600" class="mono">LIVE</text>
    <line x1="688" y1="90" x2="1136" y2="90" stroke="#1e2d47" stroke-width="1" />

    <!-- TOML content -->
    <text x="714" y="122" font-size="13.5" class="mono">
      <tspan fill="#818cf8">role</tspan><tspan fill="#64748b">  = </tspan><tspan fill="#e2e8f0">"Middle Full Stack @ Evaluar"</tspan>
    </text>
    <text x="714" y="152" font-size="13.5" class="mono">
      <tspan fill="#818cf8">core</tspan><tspan fill="#64748b">  = </tspan><tspan fill="#cbd5e1">["Go", "TypeScript", "Nuxt", "AWS"]</tspan>
    </text>
    <text x="714" y="182" font-size="13.5" class="mono">
      <tspan fill="#818cf8">lab</tspan><tspan fill="#64748b">   = </tspan><tspan fill="#cbd5e1">["relevo", "QuantTrading", "Mori"]</tspan>
    </text>
    <text x="714" y="212" font-size="13.5" class="mono">
      <tspan fill="#818cf8">focus</tspan><tspan fill="#64748b"> = </tspan><tspan fill="#e879f9">"sistemas que corren solos"</tspan>
    </text>
    <text x="714" y="242" font-size="13.5" class="mono">
      <tspan fill="#818cf8">web</tspan><tspan fill="#64748b">   = </tspan><tspan fill="#38bdf8">"cristianacalo.netlify.app"</tspan>
    </text>
    <text x="714" y="274" font-size="12.5" class="mono">
      <tspan fill="#64748b"># mode: autonomous_builder</tspan>
    </text>
    <rect class="cursor-blink" x="922" y="263" width="7" height="13" rx="1" fill="#818cf8" />
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#1e2d47" stroke-width="1" />
</svg>
