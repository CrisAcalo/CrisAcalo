<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Día en Evaluar y Noche en Lab - Diagrama Pixel Art">
  <defs>
    <linearGradient id="bgSplit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#091022" />
      <stop offset="50%" stop-color="#0b0e1a" />
      <stop offset="100%" stop-color="#110c22" />
    </linearGradient>

    <clipPath id="mapClip">
      <rect x="0" y="0" width="1200" height="420" rx="10" />
    </clipPath>

    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace; }
    </style>
  </defs>

  <g clip-path="url(#mapClip)" shape-rendering="crispEdges">
    <rect width="1200" height="420" fill="url(#bgSplit)" />

    <!-- Subtle pixel dot matrix background -->
    <line x1="600" y1="20" x2="600" y2="400" stroke="#1e2945" stroke-width="2" stroke-dasharray="4 8" />

    <!-- ================= DAY HEADER: PIXEL SUN + CLOUD ================= -->
    <g transform="translate(46, 24) scale(4)">
      <!-- Sun center -->
      <rect x="3" y="3" width="3" height="3" fill="#fbbf24" />
      <rect x="2" y="4" width="5" height="1" fill="#f59e0b" />
      <rect x="4" y="2" width="1" height="5" fill="#f59e0b" />
      <!-- Pulsing rays -->
      <g fill="#fde047">
        <rect x="4" y="0" width="1" height="1">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="4" y="8" width="1" height="1">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="0" y="4" width="1" height="1">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="8" y="4" width="1" height="1">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="1" y="1" width="1" height="1">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="7" y="1" width="1" height="1">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="1" y="7" width="1" height="1">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="7" y="7" width="1" height="1">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
    <text x="98" y="50" fill="#38bdf8" font-size="14" font-weight="700" class="mono">DÍA · EVALUAR</text>

    <!-- Drifting tiny pixel cloud -->
    <g opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="290 30; 316 30; 290 30" dur="6s" repeatCount="indefinite" />
      <g transform="scale(3)">
        <rect x="2" y="1" width="4" height="1" fill="#94a3b8" />
        <rect x="1" y="2" width="7" height="1" fill="#cbd5e1" />
        <rect x="0" y="3" width="9" height="2" fill="#e2e8f0" />
      </g>
    </g>

    <!-- ================= NIGHT HEADER: PIXEL MOON + STARS ================= -->
    <g transform="translate(818, 24) scale(4)">
      <rect x="3" y="1" width="3" height="1" fill="#f0abfc" />
      <rect x="2" y="2" width="2" height="1" fill="#e879f9" />
      <rect x="1" y="3" width="2" height="3" fill="#e879f9" />
      <rect x="2" y="6" width="2" height="1" fill="#d946ef" />
      <rect x="3" y="7" width="3" height="1" fill="#d946ef" />
      <rect x="6" y="6" width="1" height="1" fill="#d946ef" />
      <!-- Twinkling stars next to moon -->
      <rect x="7" y="2" width="1" height="1" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
      </rect>
      <rect x="8" y="4" width="1" height="1" fill="#f8fafc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
      </rect>
    </g>
    <text x="870" y="50" fill="#e879f9" font-size="14" font-weight="700" class="mono">NOCHE · LAB</text>

    <rect x="1088" y="34" width="4" height="4" fill="#818cf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="1126" y="48" width="4" height="4" fill="#d946ef">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite" />
    </rect>

    <!-- ================= ORTHOGONAL PIXEL PIPES ================= -->
    <!-- Left pipes -->
    <path d="M 384 139 L 472 139 L 472 214 L 542 214" fill="none" stroke="#1e3152" stroke-width="4" />
    <path d="M 384 239 L 542 239" fill="none" stroke="#1e3152" stroke-width="4" />
    <path d="M 384 339 L 472 339 L 472 264 L 542 264" fill="none" stroke="#1e3152" stroke-width="4" />

    <!-- Right pipes -->
    <path d="M 658 214 L 728 214 L 728 139 L 816 139" fill="none" stroke="#36224e" stroke-width="4" />
    <path d="M 658 239 L 816 239" fill="none" stroke="#36224e" stroke-width="4" />
    <path d="M 658 264 L 728 264 L 728 339 L 816 339" fill="none" stroke="#36224e" stroke-width="4" />

    <!-- Pixel Data Packets traveling along pipes -->
    <rect x="-4" y="-4" width="8" height="8" fill="#38bdf8">
      <animateMotion path="M 384 139 L 472 139 L 472 214 L 542 214" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#818cf8">
      <animateMotion path="M 384 239 L 542 239" dur="1.5s" begin="0.4s" repeatCount="indefinite" />
    </rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#34d399">
      <animateMotion path="M 384 339 L 472 339 L 472 264 L 542 264" dur="2.3s" begin="0.9s" repeatCount="indefinite" />
    </rect>

    <rect x="-4" y="-4" width="8" height="8" fill="#a855f7">
      <animateMotion path="M 658 214 L 728 214 L 728 139 L 816 139" dur="2.2s" begin="0.3s" repeatCount="indefinite" />
    </rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#d946ef">
      <animateMotion path="M 658 239 L 816 239" dur="1.6s" begin="0.7s" repeatCount="indefinite" />
    </rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#ec4899">
      <animateMotion path="M 658 264 L 728 264 L 728 339 L 816 339" dur="2.1s" begin="1.1s" repeatCount="indefinite" />
    </rect>

    <!-- ================= CENTER PIXEL COMPUTER / CORE ================= -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="2.4s" repeatCount="indefinite" />

      <!-- Orbiting pixel sparks -->
      <rect x="536" y="182" width="4" height="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.1;1" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="658" y="186" width="4" height="4" fill="#d946ef">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" repeatCount="indefinite" />
      </rect>
      <rect x="540" y="288" width="4" height="4" fill="#a855f7">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
      </rect>
      <rect x="654" y="290" width="4" height="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
      </rect>

      <!-- Pixel Retro Monitor Hub (16x14 at scale 6 = 96x84, centered at 600, 239) -->
      <g transform="translate(552, 195) scale(6)">
        <!-- Outer monitor frame -->
        <rect x="1" y="0" width="14" height="1" fill="#3b4d75" />
        <rect x="0" y="1" width="16" height="10" fill="#1e2945" />
        <rect x="1" y="1" width="14" height="9" fill="#2b3c66" />
        <!-- Screen -->
        <rect x="2" y="2" width="12" height="7" fill="#090d1a" />
        <!-- Code / face on pixel screen -->
        <rect x="4" y="4" width="2" height="2" fill="#38bdf8">
          <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.82;0.88;0.94;1" dur="3.2s" repeatCount="indefinite" />
        </rect>
        <rect x="10" y="4" width="2" height="2" fill="#d946ef">
          <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.82;0.88;0.94;1" dur="3.2s" repeatCount="indefinite" />
        </rect>
        <rect x="6" y="7" width="4" height="1" fill="#34d399" />
        <!-- Stand -->
        <rect x="6" y="11" width="4" height="1" fill="#3b4d75" />
        <rect x="4" y="12" width="8" height="2" fill="#2b3c66" />
      </g>
    </g>
    <text x="600" y="308" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="700" class="mono">CRISTIAN // LOOP</text>

    <!-- ================= LEFT PIXEL CARDS (DÍA) ================= -->
    <!-- D1: Go · Fiber · Watermill -->
    <rect x="48" y="102" width="340" height="82" fill="#070a14" />
    <rect x="44" y="98" width="340" height="82" fill="#11182d" stroke="#2a436e" stroke-width="2" />
    <!-- Pixel Server Sprite -->
    <g transform="translate(62, 121) scale(4)">
      <rect x="0" y="1" width="9" height="3" fill="#334155" />
      <rect x="1" y="2" width="1" height="1" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="3" y="2" width="4" height="1" fill="#64748b" />
      <rect x="0" y="5" width="9" height="3" fill="#334155" />
      <rect x="1" y="6" width="1" height="1" fill="#34d399">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="3" y="6" width="4" height="1" fill="#64748b" />
    </g>
    <text x="114" y="132" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Backend &amp; Colas</text>
    <text x="114" y="156" fill="#94a3b8" font-size="12.5" class="mono">Go · Fiber · Watermill</text>

    <!-- D2: Nuxt · Vue 3 · TS -->
    <rect x="48" y="202" width="340" height="82" fill="#070a14" />
    <rect x="44" y="198" width="340" height="82" fill="#11182d" stroke="#2a436e" stroke-width="2" />
    <!-- Pixel Browser Sprite -->
    <g transform="translate(62, 221) scale(4)">
      <rect x="0" y="0" width="9" height="8" fill="#1e2945" />
      <rect x="0" y="0" width="9" height="2" fill="#3b4d75" />
      <rect x="1" y="0" width="1" height="1" fill="#f43f5e" />
      <rect x="3" y="0" width="1" height="1" fill="#fbbf24" />
      <rect x="5" y="0" width="1" height="1" fill="#34d399" />
      <rect x="1" y="3" width="7" height="4" fill="#090d1a" />
      <rect x="2" y="4" width="3" height="1" fill="#818cf8" />
      <rect x="2" y="6" width="2" height="1" fill="#38bdf8">
        <animate attributeName="width" values="2;5;2" dur="2s" repeatCount="indefinite" />
      </rect>
    </g>
    <text x="114" y="232" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Web</text>
    <text x="114" y="256" fill="#94a3b8" font-size="12.5" class="mono">Nuxt · Vue 3 · TypeScript</text>

    <!-- D3: AWS SST · SQS · Cloudflare -->
    <rect x="48" y="302" width="340" height="82" fill="#070a14" />
    <rect x="44" y="298" width="340" height="82" fill="#11182d" stroke="#2a436e" stroke-width="2" />
    <!-- Pixel Cloud + Lightning Sprite -->
    <g transform="translate(62, 321) scale(4)">
      <rect x="2" y="0" width="4" height="1" fill="#93c5fd" />
      <rect x="1" y="1" width="7" height="1" fill="#bfdbfe" />
      <rect x="0" y="2" width="9" height="2" fill="#e0f2fe" />
      <!-- Animated pixel bolt -->
      <g fill="#fbbf24">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
        <rect x="4" y="4" width="2" height="1" />
        <rect x="3" y="5" width="2" height="1" />
        <rect x="4" y="6" width="2" height="1" />
        <rect x="3" y="7" width="1" height="1" />
      </g>
    </g>
    <text x="114" y="332" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Cloud &amp; Edge</text>
    <text x="114" y="356" fill="#94a3b8" font-size="12.5" class="mono">AWS SST · SQS · Cloudflare</text>

    <!-- ================= RIGHT PIXEL CARDS (NOCHE) ================= -->
    <!-- N1: Agentes & CLI -->
    <rect x="820" y="102" width="340" height="82" fill="#070a14" />
    <rect x="816" y="98" width="340" height="82" fill="#151129" stroke="#4c2c6e" stroke-width="2" />
    <!-- Pixel Robot Sprite -->
    <g transform="translate(834, 121) scale(4)">
      <rect x="4" y="0" width="1" height="1" fill="#d946ef">
        <animate attributeName="opacity" values="1;0.1;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="4" y="1" width="1" height="1" fill="#64748b" />
      <rect x="1" y="2" width="7" height="5" fill="#475569" />
      <rect x="2" y="3" width="5" height="3" fill="#090d1a" />
      <rect x="3" y="4" width="1" height="1" fill="#38bdf8">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.84;0.9;0.96;1" dur="3.1s" repeatCount="indefinite" />
      </rect>
      <rect x="5" y="4" width="1" height="1" fill="#38bdf8">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.84;0.9;0.96;1" dur="3.1s" repeatCount="indefinite" />
      </rect>
      <rect x="2" y="7" width="5" height="1" fill="#334155" />
    </g>
    <text x="886" y="132" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Agentes &amp; CLI</text>
    <text x="886" y="156" fill="#94a3b8" font-size="12.5" class="mono">relevo · git worktrees</text>

    <!-- N2: Audio & Video CUDA -->
    <rect x="820" y="202" width="340" height="82" fill="#070a14" />
    <rect x="816" y="198" width="340" height="82" fill="#151129" stroke="#4c2c6e" stroke-width="2" />
    <!-- Animated Pixel Equalizer Sprite -->
    <g transform="translate(834, 221) scale(4)">
      <rect x="0" y="4" width="2" height="4" fill="#818cf8">
        <animate attributeName="height" values="3;7;4;6;3" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="5;1;4;2;5" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="3" y="2" width="2" height="6" fill="#a855f7">
        <animate attributeName="height" values="6;3;8;4;6" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="2;5;0;4;2" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="6" y="1" width="2" height="7" fill="#d946ef">
        <animate attributeName="height" values="4;8;3;7;4" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="4;0;5;1;4" dur="1.5s" repeatCount="indefinite" />
      </rect>
    </g>
    <text x="886" y="232" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Audio &amp; Video CUDA</text>
    <text x="886" y="256" fill="#94a3b8" font-size="12.5" class="mono">Web Audio · Whisper · NVENC</text>

    <!-- N3: Quant & Mobile -->
    <rect x="820" y="302" width="340" height="82" fill="#070a14" />
    <rect x="816" y="298" width="340" height="82" fill="#151129" stroke="#4c2c6e" stroke-width="2" />
    <!-- Pulsing Pixel Heart Sprite (for Mori + Quant) -->
    <g transform="translate(834, 323)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="1.4s" repeatCount="indefinite" />
        <g transform="scale(4)">
          <rect x="1" y="0" width="2" height="1" fill="#ec4899" />
          <rect x="5" y="0" width="2" height="1" fill="#ec4899" />
          <rect x="0" y="1" width="8" height="2" fill="#f43f5e" />
          <rect x="1" y="1" width="1" height="1" fill="#fda4af" />
          <rect x="1" y="3" width="6" height="1" fill="#e11d48" />
          <rect x="2" y="4" width="4" height="1" fill="#e11d48" />
          <rect x="3" y="5" width="2" height="1" fill="#be123c" />
        </g>
      </g>
    </g>
    <text x="886" y="332" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Quant &amp; Mobile</text>
    <text x="886" y="356" fill="#94a3b8" font-size="12.5" class="mono">FastAPI · CCXT · Kotlin KMP</text>
  </g>

  <!-- Crisp Pixel Border -->
  <g shape-rendering="crispEdges">
    <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#253456" stroke-width="2" />
    <rect x="4" y="4" width="6" height="6" fill="#38bdf8" />
    <rect x="1190" y="4" width="6" height="6" fill="#d946ef" />
    <rect x="4" y="410" width="6" height="6" fill="#818cf8" />
    <rect x="1190" y="410" width="6" height="6" fill="#ec4899" />
  </g>
</svg>
