<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="100%" role="img" aria-label="Laboratorio y Sistemas en Movimiento">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#11172a" />
    </linearGradient>

    <clipPath id="c1Clip"><rect x="1" y="1" width="286" height="183" rx="14" /></clipPath>
    <clipPath id="c2Clip"><rect x="305" y="1" width="286" height="183" rx="14" /></clipPath>
    <clipPath id="c3Clip"><rect x="609" y="1" width="286" height="183" rx="14" /></clipPath>
    <clipPath id="c4Clip"><rect x="913" y="1" width="286" height="183" rx="14" /></clipPath>

    <clipPath id="synthClip"><rect x="323" y="84" width="250" height="58" rx="8" /></clipPath>

    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace; }
    </style>
  </defs>

  <!-- ================= CARD 1: RELEVO ================= -->
  <g clip-path="url(#c1Clip)">
    <rect x="1" y="1" width="286" height="183" rx="14" fill="url(#cardBg)" />
    <circle cx="250" cy="24" r="55" fill="#818cf8" opacity="0.09" />
    <text x="20" y="34" fill="#f8fafc" font-size="16" font-weight="800" class="sans">relevo</text>
    <rect x="204" y="18" width="65" height="20" rx="10" fill="#172038" stroke="#3b4d75" stroke-width="1" />
    <text x="236.5" y="32" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="700" class="mono">OSS · CLI</text>
    <text x="20" y="56" fill="#94a3b8" font-size="11.5" class="mono">git worktree · QA mutaciones</text>

    <!-- Worktree fork animation -->
    <rect x="20" y="76" width="248" height="68" rx="8" fill="#070b16" stroke="#1b2842" stroke-width="1" />
    <line x1="42" y1="110" x2="246" y2="110" stroke="#283757" stroke-width="2" />
    <path d="M 78 110 C 96 110, 96 90, 118 90 L 188 90 C 206 90, 206 110, 224 110" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite" />
    </path>
    <path d="M 78 110 C 96 110, 96 130, 118 130 L 188 130 C 206 130, 206 110, 224 110" fill="none" stroke="#d946ef" stroke-width="1.8" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite" />
    </path>

    <circle cx="48" cy="110" r="5" fill="#38bdf8" />
    <circle cx="152" cy="90" r="5" fill="#818cf8" />
    <circle cx="152" cy="130" r="5" fill="#d946ef" />
    <circle cx="240" cy="110" r="6" fill="#34d399" filter="url(#dotGlow)">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#e0f2fe" filter="url(#dotGlow)">
      <animateMotion path="M 78 110 C 96 110, 96 90, 118 90 L 188 90 C 206 90, 206 110, 224 110" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#fae8ff" filter="url(#dotGlow)">
      <animateMotion path="M 78 110 C 96 110, 96 130, 118 130 L 188 130 C 206 130, 206 110, 224 110" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
    </circle>

    <text x="20" y="168" fill="#64748b" font-size="11" class="mono">coder != auditor · zero deps</text>
  </g>
  <rect x="1" y="1" width="286" height="183" rx="14" fill="none" stroke="#223150" stroke-width="1.2" />

  <!-- ================= CARD 2: PROCEDURAL // STUDIO ================= -->
  <g clip-path="url(#c2Clip)">
    <rect x="305" y="1" width="286" height="183" rx="14" fill="url(#cardBg)" />
    <circle cx="554" cy="24" r="55" fill="#d946ef" opacity="0.09" />
    <text x="324" y="34" fill="#f8fafc" font-size="15.5" font-weight="800" class="sans">Procedural // Studio</text>
    <rect x="518" y="18" width="55" height="20" rx="10" fill="#231636" stroke="#6b21a8" stroke-width="1" />
    <text x="545.5" y="32" text-anchor="middle" fill="#e879f9" font-size="10" font-weight="700" class="mono">DSP</text>
    <text x="324" y="56" fill="#94a3b8" font-size="11.5" class="mono">Svelte 5 · Web Audio · Canvas</text>

    <!-- Live synth oscilloscope -->
    <rect x="323" y="76" width="250" height="68" rx="8" fill="#070b16" stroke="#241c3c" stroke-width="1" />
    <g clip-path="url(#synthClip)">
      <line x1="323" y1="110" x2="573" y2="110" stroke="#1e223d" stroke-width="1" />
      <path d="M 290 110 Q 305 84, 320 110 T 350 110 T 380 110 T 410 110 T 440 110 T 470 110 T 500 110 T 530 110 T 560 110 T 590 110 T 620 110" fill="none" stroke="#d946ef" stroke-width="2" filter="url(#dotGlow)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-60 0" dur="1.3s" repeatCount="indefinite" />
      </path>
      <path d="M 290 110 Q 310 130, 330 110 T 370 110 T 410 110 T 450 110 T 490 110 T 530 110 T 570 110 T 610 110 T 650 110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" from="-80 0" to="0 0" dur="1.9s" repeatCount="indefinite" />
      </path>
    </g>

    <text x="324" y="168" fill="#64748b" font-size="11" class="mono">osciladores puros · sin IA gen</text>
  </g>
  <rect x="305" y="1" width="286" height="183" rx="14" fill="none" stroke="#2a224a" stroke-width="1.2" />

  <!-- ================= CARD 3: QUANTTRADING ================= -->
  <g clip-path="url(#c3Clip)">
    <rect x="609" y="1" width="286" height="183" rx="14" fill="url(#cardBg)" />
    <circle cx="858" cy="24" r="55" fill="#34d399" opacity="0.08" />
    <text x="628" y="34" fill="#f8fafc" font-size="16" font-weight="800" class="sans">QuantTrading</text>
    <rect x="816" y="18" width="61" height="20" rx="10" fill="#0d2621" stroke="#059669" stroke-width="1" />
    <text x="846.5" y="32" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700" class="mono">24 / 7</text>
    <text x="628" y="56" fill="#94a3b8" font-size="11.5" class="mono">FastAPI · Asyncio · CCXT</text>

    <!-- Live candlestick + signal curve -->
    <rect x="627" y="76" width="250" height="68" rx="8" fill="#070b16" stroke="#182b34" stroke-width="1" />
    <!-- Subtle candles -->
    <rect x="646" y="106" width="6" height="18" rx="1" fill="#f43f5e" opacity="0.55" />
    <rect x="668" y="98" width="6" height="22" rx="1" fill="#34d399" opacity="0.65" />
    <rect x="690" y="102" width="6" height="16" rx="1" fill="#34d399" opacity="0.65" />
    <rect x="712" y="108" width="6" height="14" rx="1" fill="#f43f5e" opacity="0.55" />
    <rect x="734" y="94" width="6" height="24" rx="1" fill="#34d399" opacity="0.7" />
    <rect x="756" y="88" width="6" height="22" rx="1" fill="#34d399" opacity="0.75" />
    <rect x="778" y="92" width="6" height="16" rx="1" fill="#38bdf8" opacity="0.7" />
    <rect x="800" y="84" width="6" height="24" rx="1" fill="#34d399" opacity="0.8" />
    <rect x="822" y="86" width="6" height="18" rx="1" fill="#34d399" opacity="0.85" />
    <rect x="844" y="80" width="6" height="20" rx="1" fill="#34d399" opacity="0.9" />

    <polyline points="642,122 671,108 693,112 715,118 737,100 759,95 781,102 803,90 825,94 847,84 864,82" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle r="3.5" fill="#a7f3d0" filter="url(#dotGlow)">
      <animateMotion path="M 642 122 L 671 108 L 693 112 L 715 118 L 737 100 L 759 95 L 781 102 L 803 90 L 825 94 L 847 84 L 864 82" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <text x="628" y="168" fill="#64748b" font-size="11" class="mono">riesgo en cascada · multi-LLM</text>
  </g>
  <rect x="609" y="1" width="286" height="183" rx="14" fill="none" stroke="#1e353b" stroke-width="1.2" />

  <!-- ================= CARD 4: VIRALRADAR + MORI ================= -->
  <g clip-path="url(#c4Clip)">
    <rect x="913" y="1" width="286" height="183" rx="14" fill="url(#cardBg)" />
    <circle cx="1162" cy="24" r="55" fill="#38bdf8" opacity="0.09" />
    <text x="932" y="34" fill="#f8fafc" font-size="15.5" font-weight="800" class="sans">ViralCraft &amp; Mori</text>
    <rect x="1116" y="18" width="65" height="20" rx="10" fill="#122338" stroke="#0284c7" stroke-width="1" />
    <text x="1148.5" y="32" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700" class="mono">CUDA·KMP</text>
    <text x="932" y="56" fill="#94a3b8" font-size="11.5" class="mono">Go · Whisper · Remotion · R2</text>

    <!-- Pipeline nodes animation -->
    <rect x="931" y="76" width="250" height="68" rx="8" fill="#070b16" stroke="#1a2c44" stroke-width="1" />
    <line x1="958" y1="110" x2="1154" y2="110" stroke="#1e2d47" stroke-width="2" />
    <line x1="958" y1="110" x2="1154" y2="110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite" />
    </line>

    <rect x="946" y="96" width="44" height="28" rx="6" fill="#131c33" stroke="#38bdf8" stroke-width="1.2" />
    <text x="968" y="114" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700" class="mono">GO</text>

    <rect x="1034" y="96" width="44" height="28" rx="6" fill="#1e1535" stroke="#a855f7" stroke-width="1.2" />
    <text x="1056" y="114" text-anchor="middle" fill="#c084fc" font-size="10.5" font-weight="700" class="mono">GPU</text>

    <rect x="1122" y="96" width="44" height="28" rx="6" fill="#29142b" stroke="#ec4899" stroke-width="1.2" />
    <text x="1144" y="114" text-anchor="middle" fill="#f472b6" font-size="10.5" font-weight="700" class="mono">APP</text>

    <circle cx="990" cy="110" r="3" fill="#38bdf8" filter="url(#dotGlow)">
      <animate attributeName="cx" values="990;1034;1078;1122" dur="2.1s" repeatCount="indefinite" />
    </circle>

    <text x="932" y="168" fill="#64748b" font-size="11" class="mono">NVENC video · widgets nativos</text>
  </g>
  <rect x="913" y="1" width="286" height="183" rx="14" fill="none" stroke="#1f314d" stroke-width="1.2" />
</svg>
