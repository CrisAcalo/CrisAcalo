<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 68" width="100%" role="img" aria-hidden="true">
  <defs>
    <clipPath id="runClip">
      <rect x="0" y="0" width="1200" height="68" rx="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#runClip)" shape-rendering="crispEdges">
    <rect width="1200" height="68" fill="#090d1a" />

    <!-- Twinkling sky pixels -->
    <rect x="110" y="14" width="4" height="4" fill="#818cf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
    </rect>
    <rect x="340" y="20" width="4" height="4" fill="#e2e8f0">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite" />
    </rect>
    <rect x="590" y="12" width="4" height="4" fill="#d946ef">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <rect x="830" y="18" width="4" height="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.9s" repeatCount="indefinite" />
    </rect>
    <rect x="1060" y="14" width="4" height="4" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
    </rect>

    <!-- Floating pixel gems -->
    <g transform="translate(260, 26)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="1.6s" repeatCount="indefinite" />
        <g transform="scale(3)">
          <rect x="1" y="0" width="2" height="1" fill="#38bdf8" />
          <rect x="0" y="1" width="4" height="2" fill="#0ea5e9" />
          <rect x="1" y="1" width="1" height="1" fill="#bae6fd" />
          <rect x="1" y="3" width="2" height="1" fill="#0284c7" />
        </g>
      </g>
    </g>

    <g transform="translate(680, 24)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -3; 0 1; 0 -3" dur="1.8s" repeatCount="indefinite" />
        <g transform="scale(3)">
          <rect x="1" y="0" width="2" height="1" fill="#f0abfc" />
          <rect x="0" y="1" width="4" height="2" fill="#d946ef" />
          <rect x="1" y="1" width="1" height="1" fill="#fae8ff" />
          <rect x="1" y="3" width="2" height="1" fill="#a21caf" />
        </g>
      </g>
    </g>

    <g transform="translate(990, 26)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="1.5s" repeatCount="indefinite" />
        <g transform="scale(3)">
          <rect x="1" y="0" width="2" height="1" fill="#6ee7b7" />
          <rect x="0" y="1" width="4" height="2" fill="#34d399" />
          <rect x="1" y="1" width="1" height="1" fill="#d1fae5" />
          <rect x="1" y="3" width="2" height="1" fill="#059669" />
        </g>
      </g>
    </g>

    <!-- Walking Pixel Bot Sprite across the screen -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-50 22" to="1220 22" dur="14s" begin="-4s" repeatCount="indefinite" />
      <g transform="scale(3)">
        <!-- Antenna -->
        <rect x="4" y="0" width="2" height="1" fill="#d946ef" />
        <rect x="4" y="1" width="1" height="1" fill="#64748b" />
        <!-- Head / Visor -->
        <rect x="1" y="2" width="7" height="5" fill="#818cf8" />
        <rect x="2" y="3" width="5" height="3" fill="#0f172a" />
        <rect x="5" y="4" width="2" height="1" fill="#38bdf8" />
        <!-- Torso -->
        <rect x="2" y="7" width="5" height="3" fill="#6366f1" />
        <!-- Frame 1 legs -->
        <g>
          <animate attributeName="opacity" values="1;0;1" calcMode="discrete" dur="0.4s" repeatCount="indefinite" />
          <rect x="2" y="10" width="2" height="2" fill="#a5b4fc" />
          <rect x="5" y="10" width="2" height="1" fill="#a5b4fc" />
        </g>
        <!-- Frame 2 legs -->
        <g>
          <animate attributeName="opacity" values="0;1;0" calcMode="discrete" dur="0.4s" repeatCount="indefinite" />
          <rect x="2" y="10" width="2" height="1" fill="#a5b4fc" />
          <rect x="5" y="10" width="2" height="2" fill="#a5b4fc" />
        </g>
      </g>
    </g>

    <!-- Pixel grass/ground tiles -->
    <rect x="0" y="58" width="1200" height="4" fill="#312e81" />
    <rect x="0" y="62" width="1200" height="6" fill="#17153b" />
    <!-- Subtle pixel grass tufts -->
    <rect x="150" y="54" width="8" height="4" fill="#4f46e5" />
    <rect x="460" y="54" width="12" height="4" fill="#4f46e5" />
    <rect x="790" y="54" width="8" height="4" fill="#4f46e5" />
    <rect x="1110" y="54" width="12" height="4" fill="#4f46e5" />
  </g>
</svg>
